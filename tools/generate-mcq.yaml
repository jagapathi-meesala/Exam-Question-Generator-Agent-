name: "generate-mcq"
description: "Generate deterministic multiple-choice questions from structured input."
version: "1.0.0"
input_schema:
  type: "object"
  properties:
    topic:
      type: "string"
    source_text:
      type: "string"
    number_of_questions:
      type: "integer"
    difficulty:
      type: "string"
    options_count:
      type: "integer"
    include_answers:
      type: "boolean"
  required:
    - "topic"
    - "number_of_questions"
    - "difficulty"
    - "options_count"
implementation:
  type: "script"
  path: "generate_mcq.py"
  runtime: "python3"
annotations:
  read_only: true
  cost: "none"
  idempotent: true
