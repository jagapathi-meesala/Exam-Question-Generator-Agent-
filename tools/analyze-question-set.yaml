name: "analyze-question-set"
description: "Analyze an existing structured question set."
version: "1.0.0"
input_schema:
  type: "object"
  properties:
    questions:
      type: "array"
      items:
        type: "object"
        properties:
          id:
            type: "string"
          type:
            type: "string"
          difficulty:
            type: "string"
          topic:
            type: "string"
          marks:
            type: "integer"
  required:
    - "questions"
implementation:
  type: "script"
  path: "analyze_question_set.py"
  runtime: "python3"
annotations:
  read_only: true
  cost: "none"
  idempotent: true
